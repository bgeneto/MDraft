<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MDraft</title>
  </head>
  <body>
    <div id="app" class="app">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-tabs" role="tablist">
          <button id="tab-outline" class="sidebar-tab" role="tab" aria-selected="true">Outline</button>
          <button id="tab-files" class="sidebar-tab" role="tab" aria-selected="false">Files</button>
          <button id="tab-recent" class="sidebar-tab" role="tab" aria-selected="false">Recent</button>
        </div>
        <div id="sidebar-body" class="sidebar-body"></div>
      </aside>

      <div id="resizer" class="resizer" role="separator" aria-orientation="vertical"></div>

      <main class="workspace">
        <section id="editor-pane" class="pane editor-pane">
          <div id="editor-host" class="editor-host"></div>
        </section>
        <div id="splitter" class="splitter" role="separator" aria-orientation="vertical"></div>
        <section id="preview-pane" class="pane preview-pane">
          <article id="preview" class="markdown-body"></article>
        </section>
      </main>

      <footer id="statusbar" class="statusbar">
        <div class="status-left">
          <button id="btn-sidebar" class="status-btn icon-btn" title="Toggle sidebar (Ctrl+Shift+L)" aria-label="Toggle sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
              <path d="M3.5 6.5h17M3.5 12h17M3.5 17.5h17" />
            </svg>
          </button>
          <span class="status-modes" role="group" aria-label="View mode">
            <button id="mode-source" class="status-btn" title="Source code mode (Ctrl+/)">Source</button>
            <button id="mode-split" class="status-btn" title="Split view">Split</button>
            <button id="mode-preview" class="status-btn" title="Preview only">Preview</button>
          </span>
          <span id="status-file" class="status-item">Untitled</span>
        </div>
        <div class="status-right">
          <span id="status-cursor" class="status-item"></span>
          <span id="status-encoding" class="status-item"></span>
          <button id="btn-prefs" class="status-btn icon-btn" title="Preferences (Ctrl+,)" aria-label="Preferences">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3.1" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </button>
          <button id="btn-theme" class="status-btn icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
              <circle cx="12" cy="12" r="8.4" />
              <path d="M12 3.6a8.4 8.4 0 0 1 0 16.8z" fill="currentColor" stroke="none" />
            </svg>
          </button>
          <span id="status-words" class="status-item"></span>
        </div>
      </footer>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
