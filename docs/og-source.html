<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MDraft — Open Graph image source</title>
    <style>
      @font-face {
        font-family: "EB Garamond";
        src: url("../src/assets/fonts/EBGaramond-Variable.woff2") format("woff2");
        font-weight: 400 700;
        font-style: normal;
        font-display: block;
      }

      @font-face {
        font-family: "IBM Plex Mono";
        src: url("../src/assets/fonts/IBMPlexMono-Regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        position: relative;
        display: grid;
        grid-template-columns: 640px 1fr;
        align-items: center;
        gap: 28px;
        padding: 58px 56px 58px 64px;
        background:
          radial-gradient(70% 90% at 92% 18%, rgba(11, 186, 244, 0.22), transparent 62%),
          linear-gradient(135deg, #001a33 0%, #002050 52%, #00305c 100%);
        color: #ffffff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent 80%);
        pointer-events: none;
      }

      .copy {
        position: relative;
        z-index: 1;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 34px;
        font-size: 30px;
        font-weight: 750;
        letter-spacing: -0.03em;
      }

      .brand img {
        width: 54px;
        height: 54px;
        border-radius: 12px;
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.38);
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 18px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #8bdcff;
      }

      .eyebrow::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #0bbaf4;
        box-shadow: 0 0 0 5px rgba(11, 186, 244, 0.2);
      }

      h1 {
        margin: 0 0 20px;
        font-family: "EB Garamond", Georgia, serif;
        font-size: 74px;
        font-weight: 500;
        line-height: 0.96;
        letter-spacing: -0.03em;
      }

      h1 span {
        position: relative;
        display: inline-block;
        z-index: 0;
        white-space: nowrap;
      }

      h1 span::after {
        content: "";
        position: absolute;
        z-index: -1;
        left: 0;
        right: 0;
        bottom: 0.06em;
        height: 0.15em;
        border-radius: 999px;
        background: #0bbaf4;
        opacity: 0.65;
      }

      .languages {
        margin: 0 0 12px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 13.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #cfe9ff;
      }

      .features {
        margin: 0;
        font-size: 16px;
        color: #a8bdd2;
      }

      .shot {
        position: relative;
        z-index: 1;
        justify-self: end;
        width: 470px;
        padding: 9px;
        border: 1px solid rgba(180, 215, 245, 0.24);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.07);
        box-shadow: 0 36px 90px rgba(0, 0, 0, 0.5);
      }

      .shot img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 11px;
      }

      .glow {
        position: absolute;
        right: -90px;
        top: 110px;
        width: 620px;
        height: 420px;
        background: radial-gradient(closest-side, rgba(11, 186, 244, 0.28), transparent 72%);
        filter: blur(10px);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand">
        <img src="../src-tauri/icons/128x128@2x.png" width="54" height="54" alt="" />
        MDraft
      </div>
      <p class="eyebrow">Free · Open source · Windows &amp; Linux</p>
      <h1>The editor that <span>shows the page.</span></h1>
      <p class="languages">Markdown · AsciiDoc · Typst · HTML</p>
      <p class="features">Live preview · Word-level sync · Typst Pages · KaTeX · PDF export</p>
    </div>
    <div class="glow" aria-hidden="true"></div>
    <div class="shot">
      <img src="../site/assets/img/scroll-sync.webp" width="1800" height="1033" alt="" />
    </div>
  </body>
</html>
