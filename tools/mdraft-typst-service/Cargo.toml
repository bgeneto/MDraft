[workspace]
members = ["."]

[package]
name = "mdraft-typst-service"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Standalone incremental Typst compiler daemon for MDraft"

[dependencies]
comemo = "0.5.1"
ecow = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
typst = "0.15.1"
typst-html = "0.15.1"
typst-kit = { version = "0.15.1", features = ["scan-fonts", "embedded-fonts", "datetime", "system-packages"] }
typst-layout = "0.15.1"
typst-library = "0.15.1"
typst-pdf = "0.15.1"
typst-syntax = "0.15.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
