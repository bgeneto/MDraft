# Build the landing page in site/ and publish it to GitHub Pages.
#
# The site is static HTML assembled by scripts/build-site.mjs. Nothing from
# docs/, src/ or src-tauri/ is published; only _site/ is uploaded.
#
# GitHub Pages must be enabled with "Source: GitHub Actions" once in the
# repository settings. The workflow's GITHUB_TOKEN cannot enable it (see the
# enablement input of actions/configure-pages).

name: Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "scripts/build-site.mjs"
      - "scripts/optimize-site-images.py"
      - "src/assets/fonts/**"
      - "src-tauri/icons/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  # A release published with GITHUB_TOKEN cannot trigger `release: published`.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    permissions:
      contents: read
      pages: write
      id-token: write
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Always deploy the current site source, including on release reruns.
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # Resolve the latest stable release even on old release reruns. Never
      # publish the checkout's possibly unreleased package version on failure.
      - name: Resolve the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid stable release tag: $tag" >&2
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${tag:-unknown}"

      - name: Build the site
        run: node scripts/build-site.mjs
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_VERSION: ${{ steps.release.outputs.version }}

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
