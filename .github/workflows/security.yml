name: Security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication:
    name: Publication hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Exercise publication safeguards
        run: npm run repo:hygiene:test
      - name: Check public files and reachable branch history
        run: npm run repo:hygiene:history
      - name: Prove secret detection with a temporary synthetic control
        run: npm run security:self-test
      - name: Scan the staged snapshot, history and metadata
        run: npm run security:history
      - name: Check canonical public images without private originals
        run: npm run site:images:check
