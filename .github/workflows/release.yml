# Build installers for Windows and Linux (.deb, .rpm, AppImage), and attach them
# to a GitHub release.
#
# Triggered by pushing a tag like `v0.1.0`. The tag is checked against the
# versions in package.json and tauri.conf.json before anything is built, so a
# mislabelled release fails in seconds rather than after twenty minutes.
#
# `workflow_dispatch` exists for the case where the tag is already pushed and a
# build failed: it can be re-run from the Actions tab without moving the tag. On
# a branch it is a dry run: everything builds and is tested, nothing publishes.
#
# The `master` push and the weekly schedule only warm the Rust cache. GitHub
# scopes a cache saved by a tag run to that tag, so the next tag could never
# restore it and every release compiled all of Tauri from scratch (about 30
# minutes on Windows). Tag runs can restore caches saved on the default branch,
# so these runs build on `master` and save there, and tag runs only restore. The
# schedule refreshes the cache after a new stable Rust, whose compiler hash
# invalidates it, and keeps it from being evicted after seven idle days.
#
# The release is created with the token GitHub provides to the workflow, which
# is why `contents: write` is requested explicitly. The only secret is
# RPM_GPG_PRIVATE_KEY, used to sign the Linux RPM; its public half is committed
# as packaging/rpm-signing-key.asc.

name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - master
    paths:
      - src-tauri/Cargo.lock
      - src-tauri/Cargo.toml
      - .github/workflows/release.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Build jobs need read access only. The publish job opts into contents: write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # linuxdeploy, which Tauri uses to build the AppImage, is itself an AppImage.
  # Running it by extraction avoids requiring FUSE, which the runners lack.
  APPIMAGE_EXTRACT_AND_RUN: "1"
  # Keep the build quiet about the MSVC environment banner.
  MDRAFT_QUIET: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Build, once per platform.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the other: a Windows-only problem
      # should still leave a Linux release available to inspect.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            folder: windows/amd64
            artifact: mdraft-windows-amd64
          - os: ubuntu-22.04
            label: Linux x64
            folder: linux/amd64
            artifact: mdraft-linux-amd64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Fails before the toolchain is installed if the tag and the source
      # disagree, which is the cheapest possible moment to find out. On a manual
      # dispatch the ref is a branch, so there is no tag to compare against.
      - name: Check the version matches the tag
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            node scripts/check-version.mjs "${GITHUB_REF_NAME}"
          else
            echo "Not a tag build (${GITHUB_REF_TYPE:-unknown}); checking the two files agree."
            node scripts/check-version.mjs
          fi

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Caches the cargo registry and the target directory. Saved on `master`
      # only; see the header for why a tag's own cache is useless.
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: release-build
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # Tauri resolves these through pkg-config; there is no vendored copy.
      - name: Install the Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libhunspell-dev \
            patchelf \
            file \
            gnupg \
            rpm

      - name: Install the frontend dependencies
        run: npm ci

      # `dist.mjs` typechecks, builds the frontend, drives the platform
      # toolchain, then stages every artefact into bin/<os>/<arch>/.
      - name: Build and stage
        run: npm run dist

      # openSUSE's libzypp rejects an unsigned local RPM, while dnf does not
      # check one by default. Sign the exact file Tauri produced, then re-stage
      # so SHA256SUMS.txt and manifest.json describe the signed bytes.
      - name: Sign the RPM
        if: runner.os == 'Linux'
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RPM_GPG_PRIVATE_KEY}" ]; then
            echo "::error::RPM_GPG_PRIVATE_KEY is not set; refusing to publish an unsigned RPM."
            exit 1
          fi

          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          rpmdb="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME" "$rpmdb"' EXIT
          printf '%s' "$RPM_GPG_PRIVATE_KEY" | gpg --batch --import
          key_id="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')"
          test -n "$key_id"

          shopt -s nullglob
          rpms=(src-tauri/target/release/bundle/rpm/*.rpm)
          if [ "${#rpms[@]}" -ne 1 ]; then
            echo "Expected exactly one .rpm, found ${#rpms[@]}:" >&2
            ls -la src-tauri/target/release/bundle/rpm >&2
            exit 1
          fi
          # Ubuntu's rpm is built for /usr/bin/gpg2, which the gnupg package no
          # longer installs; point it at the gpg binary that does exist.
          rpmsign --addsign \
            --define "__gpg /usr/bin/gpg" \
            --define "_gpg_name $key_id" \
            "${rpms[0]}"

          # Verify against a throwaway RPM database: the runner's database does
          # not know the release key.
          rpm --dbpath "$rpmdb" --import packaging/rpm-signing-key.asc
          check_signature() {
            local output
            output="$(rpmkeys --dbpath "$rpmdb" --checksig "$@")"
            printf '%s\n' "$output"
            case "$output" in
              *"signatures OK"*) ;;
              *)
                echo "The RPM is not signed by the published key." >&2
                exit 1
                ;;
            esac
          }
          check_signature "${rpms[0]}"

          node scripts/stage-artifacts.mjs
          check_signature bin/linux/amd64/*.rpm

          # Keep the public key beside the package so this run's install test
          # and the download page use the key that made this signature. It is
          # release metadata rather than an app artefact, so it is appended to
          # the checksum list instead of changing what the manifest describes.
          cp packaging/rpm-signing-key.asc bin/linux/amd64/
          (cd bin/linux/amd64 && sha256sum rpm-signing-key.asc >> SHA256SUMS.txt)
          (cd bin/linux/amd64 && sha256sum -c SHA256SUMS.txt)

      - name: List what was produced
        shell: bash
        run: ls -la "bin/${{ matrix.folder }}"

      # Uploaded even when a later step fails, so a broken build can be
      # inspected instead of guessed at.
      - name: Keep the artefacts for inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: bin/${{ matrix.folder }}/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Rust tests, once per platform, beside the build rather than before it.
  #
  # `cargo test` compiles everything in the test profile and the build compiles
  # it again in release, so running both in one job put two full compiles end
  # to end. Quality runs clippy only, so this is still the one place the Rust
  # tests run, and publishing waits for them.
  # ---------------------------------------------------------------------------
  test:
    name: Rust tests (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
          - os: ubuntu-22.04
            label: Linux x64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: release-test
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install the Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libhunspell-dev

      - name: Install the frontend dependencies
        run: npm ci

      - name: Run the Rust tests on Windows
        if: runner.os == 'Windows'
        run: .\scripts\with-msvc.cmd npm run test:rust

      - name: Run the Rust tests on Linux
        if: runner.os != 'Windows'
        run: npm run test:rust

  # ---------------------------------------------------------------------------
  # Install the RPM on the distributions it targets.
  #
  # The RPM is built on Ubuntu, where nothing resolves its Requires. A missing
  # or misspelt dependency would only surface on a user's machine, so install it
  # from each distribution's own repositories and check that every shared
  # library the binary links resolves. Requires are declared by soname in
  # tauri.linux.conf.json because Fedora and openSUSE name the packages
  # differently (webkit2gtk4.1 vs libwebkit2gtk-4_1-0) but both provide sonames.
  #
  # The package is signed. Importing the public key that travelled in the
  # artefact must be enough for dnf and zypper, with no bypass flag; this is
  # the only check that the signature is usable on the distributions.
  #
  # openSUSE Tumbleweed mirrors are continuously rebuilt and can briefly serve
  # metadata for files they do not have yet. zypper treats the whole repository
  # as invalid in that case and the install fails on libraries that exist
  # upstream, which blocked a release from publishing. The openSUSE leg retries
  # the refresh and skips its install check with a warning only when the
  # repositories themselves are broken; a real dependency failure still fails
  # the job. Fedora keeps the check unconditional.
  # ---------------------------------------------------------------------------
  rpm-install:
    name: RPM install on ${{ matrix.label }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Fedora
            image: fedora:latest
            install: dnf -y install
            skip_on_repository_error: "false"
          - label: openSUSE Tumbleweed
            image: opensuse/tumbleweed:latest
            install: zypper --non-interactive install
            skip_on_repository_error: "true"
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Fetch the Linux artefacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mdraft-linux-amd64
          path: linux

      - name: Install the package and check it
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          rpms=(linux/*.rpm)
          if [ "${#rpms[@]}" -ne 1 ]; then
            echo "Expected exactly one .rpm, found ${#rpms[@]}:" >&2
            ls -la linux >&2
            exit 1
          fi

          key=linux/rpm-signing-key.asc
          if [ ! -f "$key" ]; then
            echo "The Linux artefact has no RPM public key: $key" >&2
            ls -la linux >&2
            exit 1
          fi
          rpm --import "$key"
          signature_check="$(rpmkeys --checksig "./${rpms[0]}")"
          printf '%s\n' "$signature_check"
          case "$signature_check" in
            *"signatures OK"*) ;;
            *)
              echo "The RPM is not signed by the published key." >&2
              exit 1
              ;;
          esac

          skip_check() {
            echo "::warning::$1"
            {
              echo "### openSUSE install check skipped"
              echo
              echo "$1"
              echo
              echo "The RPM signature was verified. A package or dependency problem after a clean repository refresh still fails this job."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # Tumbleweed is rebuilt continuously, and a mirror can briefly serve
          # repository metadata that names files it does not have yet. zypper
          # then discards the repository, and the install fails with "nothing
          # provides" for libraries that are present upstream. That is an
          # infrastructure problem rather than a defect in the package, so retry
          # the refresh and skip only this distribution's install check when the
          # repositories stay invalid. A real dependency or packaging failure
          # after a clean refresh still fails the job.
          if [ "${{ matrix.skip_on_repository_error }}" = "true" ]; then
            refresh_log="$RUNNER_TEMP/zypper-refresh.log"
            refreshed=false
            for attempt in 1 2 3; do
              if zypper --non-interactive refresh --force 2>&1 | tee "$refresh_log"; then
                if ! grep -qE "is invalid|Failed to retrieve|not been refreshed because of an error" "$refresh_log"; then
                  refreshed=true
                  break
                fi
              fi
              echo "::warning::openSUSE repository refresh failed (attempt $attempt/3)."
              sleep 5
            done
            if [ "$refreshed" != "true" ]; then
              skip_check "The openSUSE Tumbleweed repositories are invalid upstream."
            fi
          fi

          install_log="$RUNNER_TEMP/install.log"
          if ! ${{ matrix.install }} "./${rpms[0]}" 2>&1 | tee "$install_log"; then
            if [ "${{ matrix.skip_on_repository_error }}" = "true" ] &&
               grep -qE "is invalid|Failed to retrieve|not been refreshed because of an error|not found on medium" "$install_log"; then
              skip_check "The openSUSE Tumbleweed repositories failed during the install."
            fi
            exit 1
          fi
          rpm -qi mdraft
          echo "Requires:"
          rpm -qR mdraft

          bin=$(rpm -ql mdraft | grep -E '^/usr/bin/' | head -n 1)
          test -x "$bin"
          missing=$(ldd "$bin" | grep 'not found' || true)
          if [ -n "$missing" ]; then
            echo "Unresolved libraries in $bin:" >&2
            echo "$missing" >&2
            exit 1
          fi
          echo "PASS: every library $bin links resolves"

          desktop=$(rpm -ql mdraft | grep -E '^/usr/share/applications/.*\.desktop$')
          test -f "$desktop"
          echo "PASS: $desktop installed"

          rpm -e mdraft
          echo "PASS: package removes cleanly"

  # ---------------------------------------------------------------------------
  # Publish, once, after every platform has built.
  # ---------------------------------------------------------------------------
  release:
    name: Publish the release
    permissions:
      contents: write
    needs: [build, test, rpm-install]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      # A single job creates the release. Letting both build jobs create it
      # races on the first upload, and the loser fails with a 422.
      - name: Collect every artefact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist

      # Both platforms stage a `SHA256SUMS.txt` and a `manifest.json`, and
      # release assets share one flat namespace -- so uploading both silently
      # leaves whichever finished last, and the other platform's checksums are
      # gone. The first release shipped the Linux checksums alone for exactly
      # this reason. Everything else already has a distinct name.
      - name: Disambiguate the shared names
        run: |
          set -eu
          mkdir -p release
          for dir in dist/*/; do
            platform=$(basename "$dir")
            platform=${platform#mdraft-}
            for file in "$dir"*; do
              [ -f "$file" ] || continue
              name=$(basename "$file")
              case "$name" in
                SHA256SUMS.txt) name="SHA256SUMS-$platform.txt" ;;
                manifest.json) name="manifest-$platform.json" ;;
              esac
              cp "$file" "release/$name"
            done
          done
          echo "Publishing:"
          ls -la release

      - name: Create the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # GitHub writes the notes from the commits since the previous tag. The
          # README carries the detail; these are a summary, not the changelog.
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release/*
