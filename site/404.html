<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="{{SITE_URL}}" />
    <title>Page not found — MDraft</title>
    <meta
      name="description"
      content="The page you requested is not part of the MDraft site. Return to the homepage to download the editor or read the documentation."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#fbfaf6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#06111f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./assets/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="stylesheet" href="./styles.css" />
    <script>
      try {
        const theme = localStorage.getItem("mdraft-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {
        // Follow the operating system theme.
      }
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="./" aria-label="MDraft home">
          <img src="./assets/apple-touch-icon.png" width="34" height="34" alt="" />
          <span>MDraft</span>
        </a>
        <div class="header-actions">
          <div class="lang-switch" role="group" aria-label="Language">
            <a href="./" aria-current="page" lang="en" hreflang="en">EN</a>
            <a href="./pt-br/" lang="pt-BR" hreflang="pt-BR">PT</a>
          </div>
          <button
            class="icon-button"
            type="button"
            data-theme-toggle
            data-label-light="Switch to light theme"
            data-label-dark="Switch to dark theme"
            aria-label="Switch to dark theme"
            aria-pressed="false"
          >
            <svg
              class="icon-sun"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
              />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5Z"
              />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="container notfound">
      <div>
        <p class="code">404</p>
        <h1>This page is not here.</h1>
        <p>
          The link may be old, or the document has moved. The editor is still where you left it.
        </p>
        <div class="actions actions-center">
          <a class="btn btn-primary" href="./">Go to the homepage</a>
          <a class="btn btn-ghost" href="https://github.com/bgeneto/MDraft">View on GitHub</a>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-bottom">
        <p>© {{YEAR}} MDraft contributors. MIT licensed.</p>
        <p>This page sets no cookies and loads nothing from third parties.</p>
      </div>
    </footer>

    <script>
      // GitHub Pages serves one custom 404 for the whole project. When the
      // missing path is under /pt-br/, present the same page in Portuguese
      // instead of sending the reader to a bilingual switch first.
      (() => {
        const base = new URL(document.baseURI).pathname;
        if (!location.pathname.startsWith(`${base}pt-br/`)) return;
        document.documentElement.lang = "pt-BR";
        document.title = "Página não encontrada — MDraft";
        const description = document.querySelector('meta[name="description"]');
        if (description) {
          description.content =
            "A página solicitada não faz parte do site do MDraft. Volte à página inicial para baixar o editor ou ler a documentação.";
        }
        const heading = document.querySelector(".notfound h1");
        const body = document.querySelector(".notfound p:not(.code)");
        const home = document.querySelector(".notfound a.btn-primary");
        const github = document.querySelector(".notfound a.btn-ghost");
        if (heading) heading.textContent = "Esta página não está aqui.";
        if (body) {
          body.textContent =
            "O link pode ser antigo, ou o documento mudou de lugar. O editor continua onde você deixou.";
        }
        if (home) home.textContent = "Ir para a página inicial";
        if (github) github.textContent = "Ver no GitHub";
        for (const link of document.querySelectorAll(".lang-switch a")) {
          if (link.getAttribute("hreflang") === "pt-BR") link.setAttribute("aria-current", "page");
          else link.removeAttribute("aria-current");
        }
        for (const group of document.querySelectorAll('.lang-switch[role="group"]')) {
          group.setAttribute("aria-label", "Idioma");
        }
        const toggle = document.querySelector("[data-theme-toggle]");
        if (toggle) {
          toggle.dataset.labelLight = "Mudar para o tema claro";
          toggle.dataset.labelDark = "Mudar para o tema escuro";
          toggle.setAttribute("aria-label", "Mudar para o tema escuro");
        }
      })();
    </script>
    <script src="./site.js" defer></script>
  </body>
</html>
