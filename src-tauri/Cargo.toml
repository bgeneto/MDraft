[package]
name = "mdraft"
version = "0.7.2"
description = "A Tauri 2 Markdown, Typst, HTML and AsciiDoc editor"
authors = ["bernh"]
edition = "2024"
rust-version = "1.91"
license = "MIT"

[lib]
# The `_lib` suffix keeps the lib name unique and avoids a Windows bin/lib clash.
name = "mdraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[target.'cfg(target_os = "linux")'.build-dependencies]
pkg-config = "0.3"

[dependencies]
tauri = { version = "2.12.4", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
# One process per app identity: a second launch forwards its paths and exits
# before creating a WebView, which also prevents the 0x800700AA profile clash.
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2.5.0"
# Approximate token count for the status bar. Zero dependencies and no
# vocabulary: a full BPE tokenizer would add 8.7 MB of tables and take 40-60 ms
# per megabyte, which is far too much for a counter that follows typing.
tokenx-rs = "0.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Streaming HTTP for the opt-in AI Assistant. Default features use rustls with
# the platform certificate verifier, so no OpenSSL headers are needed on either
# platform; `Response::chunk` streams the SSE body without the `stream` feature.
# Declared directly because this crate calls it, even though Tauri already
# builds it for some targets.
#
# The provider is named explicitly. Cargo features are additive: reqwest's
# `rustls` feature enables aws-lc-rs, while `ureq` (image and pandoc
# downloads) already enables ring. rustls refuses to choose between two
# providers at runtime, and aws-lc-sys would add a CMake/C build to every
# platform. `rustls-no-provider` plus the direct `rustls` dependency below
# keeps the tree on ring, which is already compiled.
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls-no-provider",
    "charset",
    "http2",
    "json",
    "system-proxy",
    # OpenAI-compatible gateways and proxies often compress /models (the
    # validation endpoint returns gzip when Accept-Encoding advertises it).
    # Without these features reqwest advertises nothing and parses raw gzip as
    # JSON when a proxy compresses anyway.
    "gzip",
    "brotli",
    "deflate",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
# Cancellation (`select!`) and a per-chunk read timeout in the streaming loop.
# Tauri already owns a tokio runtime; these features only add what this crate
# names, and cargo unions them with Tauri's.
tokio = { version = "1", features = ["macros", "sync", "time"] }
# API keys live in the OS credential store, never in settings.json. The default
# `v1` feature selects the native store per target: Windows Credential Manager,
# macOS Keychain, Secret Service on Linux.
keyring = "4.2"
# URL-path decoding for the HTML preview scheme. Already present through Tauri;
# declared directly because this crate uses it.
percent-encoding = "2"
# Blocking HTTPS client for user-initiated downloads: images, and the optional
# pandoc archive. Default features are exactly `rustls` + `gzip`, so no async
# runtime is pulled in.
ureq = "3.4.2"
base64 = "0.23.1"
# Pandoc archives are compressed. `rust_backend` keeps flate2 pure Rust, so no C
# toolchain is needed on any platform.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# Checks the downloaded pandoc archive against the digest GitHub publishes for
# that release asset. Fetching a 40 MB binary and then executing it without this
# would be trusting the network with arbitrary code execution.
sha2 = "0.11"
# Installed font names for the Typography picker. fontique wraps the native text
# stacks — DirectWrite on Windows, CoreText on macOS, fontconfig on Linux — and
# exposes family names without loading or copying font bytes. The
# `fontconfig-dlopen` feature keeps the Linux build free of a new pkg-config
# dependency: libfontconfig is already present wherever GTK runs, and fontique
# falls back to an empty collection if it cannot be loaded.
fontique = { version = "0.12", features = ["fontconfig-dlopen"] }

# The two archive shapes pandoc ships: Windows and macOS get a .zip, Linux a
# .tar.gz. Each platform therefore compiles only the reader it needs.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_os = "linux")'.dependencies]
tar = "0.4.46"
# Typst publishes its Linux build as a .tar.xz, unlike pandoc's .tar.gz.
# `lzma-rs` is pure Rust, matching flate2's `rust_backend`, so the installer
# needs no C toolchain, no liblzma headers and no system xz binary.
lzma-rs = "0.3"
# GTK3 takes the Wayland app id from GLib's program name, and the compositor
# matches that id against a .desktop file. Declared directly because lib.rs
# sets it; the version is the one Tauri's GTK already pulls in.
glib = "0.18"
# Native printing goes through WebKitGTK's PrintOperation: the dialog, and a
# direct PDF written through GTK print settings. Both crates are already in the
# tree through Tauri; declaring them directly pins the API this crate uses.
gtk = "0.18"
webkit2gtk = "2.0"

# The system spell checker. Dictionaries stay on the machine: Windows uses the
# Spell Checking API (the same service WebView2 would), Linux opens the hunspell
# files the distro installed, and macOS uses NSSpellChecker. None of these
# crates embeds a word list.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
] }
# The native print surface reaches WebView2's printing interfaces directly.
# webview2-com 0.39 (the version wry/Tauri use) is built on windows and
# windows-core 0.62; keep this direct dependency on the same line so the COM
# interfaces cannot diverge. windows-core 0.100 is a different major line and
# is not interchangeable with webview2-com's 0.62 types.
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSRange"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSSpellChecker"] }
dispatch2 = "0.3"

[profile.release]
# Thin LTO with parallel codegen, not fat LTO with one codegen unit. Fat LTO is
# single-threaded: on this crate it made the final step take 104 s, against 27 s
# with these settings, and `npm run dist` builds that crate twice. Binary size
# barely moves either way. A markdown editor cannot tell the two apart at
# runtime, so the build time is the difference that matters.
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
