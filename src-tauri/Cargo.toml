[package]
name = "mdraft"
version = "0.4.0"
description = "A Tauri 2 Markdown, Typst, HTML and AsciiDoc editor"
authors = ["bernh"]
edition = "2024"
rust-version = "1.91"
license = "MIT"

[lib]
# The `_lib` suffix keeps the lib name unique and avoids a Windows bin/lib clash.
name = "mdraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[target.'cfg(target_os = "linux")'.build-dependencies]
pkg-config = "0.3"

[dependencies]
tauri = { version = "2.12.4", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-window-state = "2.5.0"
# Approximate token count for the status bar. Zero dependencies and no
# vocabulary: a full BPE tokenizer would add 8.7 MB of tables and take 40-60 ms
# per megabyte, which is far too much for a counter that follows typing.
tokenx-rs = "0.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# URL-path decoding for the HTML preview scheme. Already present through Tauri;
# declared directly because this crate uses it.
percent-encoding = "2"
# Blocking HTTPS client for user-initiated downloads: images, and the optional
# pandoc archive. Default features are exactly `rustls` + `gzip`, so no async
# runtime is pulled in.
ureq = "3.4.2"
base64 = "0.23.1"
# Pandoc archives are compressed. `rust_backend` keeps flate2 pure Rust, so no C
# toolchain is needed on any platform.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# Checks the downloaded pandoc archive against the digest GitHub publishes for
# that release asset. Fetching a 40 MB binary and then executing it without this
# would be trusting the network with arbitrary code execution.
sha2 = "0.11"

# The two archive shapes pandoc ships: Windows and macOS get a .zip, Linux a
# .tar.gz. Each platform therefore compiles only the reader it needs.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_os = "linux")'.dependencies]
tar = "0.4.46"
# Typst publishes its Linux build as a .tar.xz, unlike pandoc's .tar.gz.
# `lzma-rs` is pure Rust, matching flate2's `rust_backend`, so the installer
# needs no C toolchain, no liblzma headers and no system xz binary.
lzma-rs = "0.3"

# The system spell checker. Dictionaries stay on the machine: Windows uses the
# Spell Checking API (the same service WebView2 would), Linux opens the hunspell
# files the distro installed, and macOS uses NSSpellChecker. None of these
# crates embeds a word list.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSRange"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSSpellChecker"] }
dispatch2 = "0.3"

[profile.release]
# Thin LTO with parallel codegen, not fat LTO with one codegen unit. Fat LTO is
# single-threaded: on this crate it made the final step take 104 s, against 27 s
# with these settings, and `npm run dist` builds that crate twice. Binary size
# barely moves either way. A markdown editor cannot tell the two apart at
# runtime, so the build time is the difference that matters.
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
