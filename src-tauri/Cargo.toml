[package]
name = "mdraft"
version = "0.2.1"
description = "A Tauri 2 markdown editor in the spirit of Typora"
authors = ["bernh"]
edition = "2024"
rust-version = "1.91"
license = "MIT"

[lib]
# The `_lib` suffix keeps the lib name unique and avoids a Windows bin/lib clash.
name = "mdraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-window-state = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Blocking HTTPS client for user-initiated downloads: images, and the optional
# pandoc archive. Default features are exactly `rustls` + `gzip`, so no async
# runtime is pulled in.
ureq = "3.4.2"
base64 = "0.23.1"
# Pandoc archives are compressed. `rust_backend` keeps flate2 pure Rust, so no C
# toolchain is needed on any platform.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# Checks the downloaded pandoc archive against the digest GitHub publishes for
# that release asset. Fetching a 40 MB binary and then executing it without this
# would be trusting the network with arbitrary code execution.
sha2 = "0.11"

# The two archive shapes pandoc ships: Windows and macOS get a .zip, Linux a
# .tar.gz. Each platform therefore compiles only the reader it needs.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_os = "linux")'.dependencies]
tar = "0.4.46"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
